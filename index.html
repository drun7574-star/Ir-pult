<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Универсальный пульт</title>
<style>
:root{--bg:#eef0f4;--card:#fff;--tx:#161a22;--mut:#6b7280;--btn:#e6e9f0;--acc:#4f6bff;--pw:#ef4444;--scr:#0f172a;--scrtx:#7CFFB2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1017;--card:#171b26;--tx:#eef1f8;--mut:#98a2b3;--btn:#252b3a;--scrtx:#7CFFB2;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{max-width:460px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:6px 0 12px;display:flex;justify-content:space-between;align-items:center}
.ir{width:12px;height:12px;border-radius:50%;background:#555;transition:.1s}
.ir.on{background:#ff3b3b;box-shadow:0 0 12px 4px #ff3b3b}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.dev{background:var(--card);border:2px solid transparent;border-radius:16px;padding:14px 4px;text-align:center;cursor:pointer;color:var(--tx);font:inherit;font-size:13px}
.dev span{display:block;font-size:30px;margin-bottom:4px}
.dev.lit{border-color:var(--acc)}
#remote{display:none}
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.back{background:var(--btn);color:var(--tx);border:0;border-radius:12px;padding:10px 14px;font-size:15px;cursor:pointer}
.body{background:var(--card);border-radius:28px;padding:16px;box-shadow:0 8px 30px rgba(0,0,0,.18)}
.scr{background:var(--scr);color:var(--scrtx);border-radius:14px;padding:12px;min-height:84px;font-family:ui-monospace,Menlo,monospace;font-size:14px;line-height:1.5;margin-bottom:14px;position:relative;overflow:hidden}
.scr .glow{position:absolute;right:12px;top:12px;width:56px;height:56px;border-radius:50%}
.rows{display:flex;flex-direction:column;gap:9px}
.row{display:grid;gap:9px}
.b{background:var(--btn);color:var(--tx);border:0;border-radius:14px;padding:13px 4px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;min-height:46px}
.b:active{transform:scale(.94);background:var(--acc);color:#fff}
.b.pw{background:var(--pw);color:#fff}
.b.ok{background:var(--acc);color:#fff;border-radius:50%}
.sw{min-height:40px;border:2px solid rgba(255,255,255,.4)}
.off .b:not(.pw){opacity:.4}
.b{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#000c;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;transition:.2s;pointer-events:none;max-width:90%;text-align:center;z-index:9}
.in{width:100%;padding:12px;border-radius:12px;border:0;background:var(--btn);color:var(--tx);font:inherit;margin-bottom:8px}
#stat{font-size:13px;text-align:center;margin:0 0 12px;color:var(--mut)}
.note{font-size:12px;color:var(--mut);text-align:center;margin-top:14px;line-height:1.4}
</style></head><body>
<div class="app">
<div id="home"><h1>📡 Универсальный пульт <i class="ir" id="ir1"></i></h1>
<div class="grid" id="grid"></div>
<p id="stat"></p><p class="note">Выбери устройство — откроется его пульт.<br>Зажми любую кнопку на 1 секунду, чтобы задать или изменить её ИК-код.</p></div>
<div id="remote"><div class="top"><button class="back" id="back">← Назад</button><b id="title" style="flex:1"></b><i class="ir" id="ir2"></i></div>
<div class="body"><div class="scr" id="scr"></div><div class="rows" id="rows"></div></div></div>
</div>
<div id="cams" class="app" style="display:none"><div class="top"><button class="back" id="cback">← Назад</button><b>📹 Камеры</b></div><div class="body"><div class="scr" id="cst" style="min-height:48px">Нажми «Найти» — приложение проверит устройства в домашней сети.</div><input class="in" id="sub" value="192.168.1"><button class="b" id="scan" style="width:100%;margin-bottom:12px">🔍 Найти камеры</button><div class="rows" id="clist"></div><div id="view" style="display:none;margin-top:12px"><img id="vimg" style="width:100%;border-radius:12px;display:none" alt=""><video id="vvid" playsinline autoplay style="width:100%;border-radius:12px;display:none"></video><div class="row" style="grid-template-columns:1fr 1fr;margin-top:8px"><button class="b" id="vsnd">🔊 Звук</button><button class="b" id="vstop">⏹ Стоп</button></div></div><p class="note">Добавить вручную (адрес потока или снимка):</p><input class="in" id="curl" placeholder="http://192.168.1.50/video.mjpg"><select class="in" id="ctype"><option value="mjpeg">MJPEG-поток</option><option value="snap">Снимок (обновляется)</option><option value="hls">HLS (.m3u8, со звуком)</option></select><button class="b" id="cadd" style="width:100%">Добавить</button></div></div>
<div id="toast"></div>
<script src="cordova.js"></script>
<script>

const nums=f=>[[1,2,3],[4,5,6],[7,8,9],['',0,'']].map(r=>r.map(n=>n===''?null:[String(n),s=>f(s,n)]));
const COLORS=['#ff2d2d','#ff8a00','#ffe600','#35e04a','#00e5d0','#2d7bff','#8a3dff','#ff3dd0','#ffffff','#ffb347','#7fffd4','#c0a0ff'];
const D=[
{n:'Кондиционер',i:'❄️',s:{on:0,t:24,m:'Авто',f:'Авто',sw:0},

 rows:[[PW,['Режим',s=>s.m=cyc(['Авто','Холод','Тепло','Сушка','Вент.'],s.m)]],[['−',s=>s.t=cl(s.t-1,16,30)],['+',s=>s.t=cl(s.t+1,16,30)]],[['Скорость',s=>s.f=cyc(['Авто','Низк.','Средн.','Высок.'],s.f)],['Жалюзи',s=>s.sw=!s.sw]],[['Эко',s=>{s.t=26;s.m='Холод'}],['Сон',s=>{s.t=cl(s.t+1,16,30)}],['Турбо',s=>{s.f='Высок.';s.t=16}]],[['📡 Автопоиск кода (вкл/выкл)',()=>bruteStart(),'util']]]},
{n:'Телевизор',i:'📺',s:{on:0,v:20,ch:1,mu:0,src:'HDMI 1'},

 rows:[[PW,['🔇',s=>s.mu=!s.mu],['Вход',s=>s.src=cyc(['HDMI 1','HDMI 2','AV','USB','ТВ'],s.src)]],...nums((s,n)=>{s.ch=n}),[['Гр −',s=>{s.v=cl(s.v-5,0,100);s.mu=0}],['Меню',s=>{}],['Гр +',s=>{s.v=cl(s.v+5,0,100);s.mu=0}]],[['Кан −',s=>s.ch=Math.max(1,s.ch-1)],['Кан +',s=>s.ch++]],...dpad(s=>{},s=>{},s=>{},s=>{},s=>{}),[['Назад',s=>{}],['Домой',s=>{}],['Инфо',s=>{}]]]},
{n:'Проектор / баннер',i:'📽️',s:{on:0,src:'HDMI',foc:50,key:0,blank:0,frz:0},

 rows:[[PW,['Вход',s=>s.src=cyc(['HDMI','VGA','USB','Wi‑Fi'],s.src)]],[['Фокус −',s=>s.foc=cl(s.foc-5,0,100)],['Фокус +',s=>s.foc=cl(s.foc+5,0,100)]],[['Трап. −',s=>s.key=cl(s.key-1,-20,20)],['Трап. +',s=>s.key=cl(s.key+1,-20,20)]],[['Скрыть',s=>s.blank=!s.blank],['Стоп-кадр',s=>s.frz=!s.frz]],...dpad(s=>{},s=>{},s=>{},s=>{},s=>{}),[['Меню',s=>{}],['Назад',s=>{}]]]},
{n:'Компьютер',i:'🖥️',s:{on:0,v:40,mu:0,pl:0,sl:0,lk:0},
 info:s=>s.on?`${s.sl?'Спящий режим':s.lk?'Экран заблокирован':'Работает'}\nГромкость: ${s.mu?'🔇':s.v}\n${s.pl?'▶ Играет':'⏸ Пауза'}`:'ВЫКЛ',
 rows:[[PW,['Сон',s=>s.sl=!s.sl],['Перезагр.',s=>{s.sl=0;s.lk=0;s.pl=0}]],[['Блок',s=>s.lk=!s.lk],['Alt+Tab',s=>{}],['Раб. стол',s=>{}]],[['⏮',s=>{}],['⏯',s=>s.pl=!s.pl],['⏭',s=>{}]],[['🔉',s=>{s.v=cl(s.v-5,0,100);s.mu=0}],['🔇',s=>s.mu=!s.mu],['🔊',s=>{s.v=cl(s.v+5,0,100);s.mu=0}]],...dpad(s=>{},s=>{},s=>{},s=>{},s=>{}),[['Esc',s=>{}],['Enter',s=>{}]]]},
{n:'Лампа',i:'💡',s:{on:0,br:70,tp:50,tm:0},
 glow:s=>s.on?`rgba(255,${Math.round(150+s.tp*1.0)},${Math.round(60+s.tp*1.9)},${s.br/100})`:'transparent',
 info:s=>s.on?`Яркость: ${s.br}%\nТемпература: ${s.tp<35?'тёплая':s.tp>65?'холодная':'нейтральная'}\nТаймер: ${s.tm?s.tm+' мин':'нет'}`:'ВЫКЛ',
 rows:[[PW,['Таймер',s=>s.tm=cyc([0,15,30,60],s.tm)]],[['☀− ',s=>s.br=cl(s.br-10,5,100)],['☀+',s=>s.br=cl(s.br+10,5,100)]],[['🔥 Теплее',s=>s.tp=cl(s.tp-15,0,100)],['❄ Холоднее',s=>s.tp=cl(s.tp+15,0,100)]],[['Ночник',s=>{s.br=5;s.tp=10}],['Чтение',s=>{s.br=80;s.tp=60}],['Макс',s=>{s.br=100;s.tp=50}]]]},
{n:'LED-лента',i:'🌈',s:{on:0,c:'#2d7bff',br:80,md:'Статика',sp:3},
 glow:s=>s.on?s.c:'transparent',
 info:s=>s.on?`Режим: ${s.md}\nЯркость: ${s.br}%\nСкорость: ${s.sp}`:'ВЫКЛ',
 rows:[[PW,['Режим',s=>s.md=cyc(['Статика','Плавно','Вспышка','Радуга','Пульс'],s.md)]],[['☀−',s=>s.br=cl(s.br-10,5,100)],['☀+',s=>s.br=cl(s.br+10,5,100)],['Скор −',s=>s.sp=cl(s.sp-1,1,5)],['Скор +',s=>s.sp=cl(s.sp+1,1,5)]],...[0,4,8].map(k=>COLORS.slice(k,k+4).map(c=>['',s=>{s.c=c;s.md='Статика'},'sw',c]))]},
{n:'Камера',i:'📷',s:{on:0,rec:0,z:1,px:0,py:0,nt:0,mic:1,ph:0},
 info:s=>s.on?`${s.rec?'🔴 ЗАПИСЬ':'Ожидание'}\nZoom: x${s.z.toFixed(1)}  Поворот: ${s.px}°/${s.py}°\nНочь: ${s.nt?'да':'нет'}  Микрофон: ${s.mic?'вкл':'выкл'}\nСнимков: ${s.ph}`:'ВЫКЛ',
 rows:[[PW,['⏺ REC',s=>s.rec=!s.rec],['📸',s=>s.ph++]],[['Zoom −',s=>s.z=cl(s.z-.5,1,8)],['Zoom +',s=>s.z=cl(s.z+.5,1,8)]],...dpad(s=>s.py=cl(s.py+10,-90,90),s=>s.py=cl(s.py-10,-90,90),s=>s.px=cl(s.px-10,-180,180),s=>s.px=cl(s.px+10,-180,180),s=>{s.px=0;s.py=0}),[['🌙 Ночь',s=>s.nt=!s.nt],['🎤',s=>s.mic=!s.mic]]]},
{n:'Вентилятор',i:'🌀',s:{on:0,sp:1,osc:0,tm:0,md:'Норма'},
 info:s=>s.on?`Скорость: ${s.sp}/3\nПоворот: ${s.osc?'вкл':'выкл'}\nРежим: ${s.md}\nТаймер: ${s.tm?s.tm+' ч':'нет'}`:'ВЫКЛ',
 rows:[[PW,['Поворот',s=>s.osc=!s.osc]],[['Ск −',s=>s.sp=cl(s.sp-1,1,3)],['Ск +',s=>s.sp=cl(s.sp+1,1,3)]],[['Режим',s=>s.md=cyc(['Норма','Природа','Сон'],s.md)],['Таймер',s=>s.tm=cyc([0,1,2,4],s.tm)]],[['📡 Автопоиск кода (вкл/выкл)',()=>bruteStart(),'util']]]},
{n:'Колонка / Аудио',i:'🔊',s:{on:0,v:30,pl:0,tr:1,bs:0,bt:0},
 info:s=>s.on?`${s.pl?'▶':'⏸'} Трек ${s.tr}\nГромкость: ${s.v}\nБас: ${s.bs>0?'+':''}${s.bs}\nBluetooth: ${s.bt?'подключён':'ожидание'}`:'ВЫКЛ',
 rows:[[PW,['Bluetooth',s=>s.bt=!s.bt]],[['⏮',s=>s.tr=Math.max(1,s.tr-1)],['⏯',s=>s.pl=!s.pl],['⏭',s=>s.tr++]],[['Гр −',s=>s.v=cl(s.v-5,0,100)],['Гр +',s=>s.v=cl(s.v+5,0,100)]],[['Бас −',s=>s.bs=cl(s.bs-1,-5,5)],['Бас +',s=>s.bs=cl(s.bs+1,-5,5)]]]},

 rows:[
 [['🔦 Фонарик',bonusTorch,'util']],
 [['📣 Бип',()=>beep(880,120),'util'],['🚨 Сирена',siren,'util']],
 [['🎲 Кубик',bonusDice,'util'],['🪙 Монетка',bonusCoin,'util']],
 [['🎱 Число 1-100',bonusRand,'util']],
 [['🔮 Шар предсказаний',bonus8ball,'util']],
 [['📳 Вибро: коротко',()=>bonusVibe([80]),'util'],['📳 Вибро: SOS',()=>bonusVibe([80,60,80,60,80,180,220,100,220,100,220,180,80,60,80,60,80]),'util']],
 [['🔴🟢🔵 Вспышка экрана',bonusFlash,'util']],

 [['🔋 Заряд батареи',bonusBattery,'util']],
 [['🎵 Мелодия',bonusMelody,'util']],
 [['📈 Счётчик кликов',bonusClick,'util']],
 [['💬 Случайная фраза',bonusQuote,'util']],
 [['💡 Факт дня',bonusFact,'util']],
 [['🎨 Светлая/тёмная тема',bonusTheme,'util']],

let torchTrack=null;
function beep(f,ms){try{const ctx=new(window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=f;o.connect(g);g.connect(ctx.destination);g.gain.setValueAtTime(.15,ctx.currentTime);o.start();setTimeout(()=>{o.stop();ctx.close()},ms)}catch(e){toast('Звук недоступен')}}
function siren(){[600,900,600,900,600,900].forEach((f,i)=>setTimeout(()=>beep(f,180),i*190));toast('🚨 Сирена')}
function bonusDice(){toast('🎲 Выпало: '+(1+Math.floor(Math.random()*6)))}
function bonusCoin(){toast(Math.random()<.5?'🪙 Орёл':'🪙 Решка')}
function bonusRand(){toast('🎱 '+(1+Math.floor(Math.random()*100)))}
function bonus8ball(){const a=['Да','Нет','Скорее да','Скорее нет','Спроси позже','Неоднозначно','Точно да!','Маловероятно'];toast('🔮 '+a[Math.floor(Math.random()*a.length)])}
function bonusVibe(p){try{navigator.vibrate&&navigator.vibrate(p);toast('📳 Вибро')}catch(e){toast('Вибро недоступно')}}
function bonusFlash(){const o=document.createElement('div');o.style.cssText='position:fixed;inset:0;z-index:99;background:red';document.body.appendChild(o);const c=['red','lime','blue','yellow','white'];let i=0;const t=setInterval(()=>{o.style.background=c[i++%c.length];if(i>14){clearInterval(t);o.remove()}},150)}
function bonusNight(){document.body.style.filter=document.body.style.filter?'':'brightness(.3) sepia(.4)';toast(document.body.style.filter?'🌙 Ночной режим включён':'☀️ Обычный режим')}
let swT=null,swS=0;function bonusStopwatch(){if(swT){clearInterval(swT);swT=null;toast('⏱ Остановлено: '+swS.toFixed(1)+' с');return}swS=0;const t0=Date.now();swT=setInterval(()=>{swS=(Date.now()-t0)/1000},100);toast('⏱ Старт')}
function bonusTimer(s){toast('⏲ Таймер на '+s+' сек запущен');setTimeout(()=>{beep(1000,300);toast('⏰ Время вышло!');try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}},s*1000)}
function bonusBattery(){if(navigator.getBattery)navigator.getBattery().then(b=>toast('🔋 '+Math.round(b.level*100)+'%'+(b.charging?' (заряжается)':'')));else toast('Браузер не даёт доступ к заряду')}
function bonusMelody(){[523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,180),i*200));toast('🎵 Динь-дон')}
let clickCt=0;function bonusClick(){clickCt++;toast('📈 Кликов: '+clickCt)}
function bonusQuote(){const q=['Сделай перерыв, ты это заслужил.','Главное — начать.','Улыбнись, это бесплатно.','Ты справишься.'];toast('💬 '+q[Math.floor(Math.random()*q.length)])}
function bonusFact(){const f=['У осьминогих сердец два желудка.','Страус не может прыгать назад.','Бананы — ягоды, а не фрукты.','Мёд не портится тысячи лет.'];toast('💡 '+f[Math.floor(Math.random()*f.length)])}
function bonusTheme(){document.documentElement.dataset.theme=document.documentElement.dataset.theme==='light'?'dark':'light';toast('🎨 Тема переключена')}
function bonusClip(){const t=cur?cur.info(cur.s):'готово';navigator.clipboard&&navigator.clipboard.writeText(t).then(()=>toast('📋 Скопировано')).catch(()=>toast('Не удалось скопировать'))}
let tapCt=0;function bonusTapCounter(){tapCt++;toast('🏆 Нажатий всего за сессию: '+tapCt)}
function bonusMulti(){const a=1+Math.floor(Math.random()*9),b=1+Math.floor(Math.random()*9);toast('🧮 '+a+' × '+b+' = '+(a*b))}
function bonusPass(){const ch='abcdefghjkmnpqrstuvwxyzABCDEFGHJKMNPQRSTUVWXYZ23456789!@#';let p='';for(let i=0;i<12;i++)p+=ch[Math.floor(Math.random()*ch.length)];toast('🫧 '+p)}
function bonusTorch(){navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}).then(s=>{const tr=s.getVideoTracks()[0];const cap=tr.getCapabilities&&tr.getCapabilities();if(cap&&cap.torch){const on=!torchTrack;tr.applyConstraints({advanced:[{torch:on}]});if(on)torchTrack=tr;else{tr.stop();torchTrack=null}toast(on?'🔦 Фонарик включён':'🔦 Фонарик выключен')}else{s.getTracks().forEach(t=>t.stop());toast('Фонарик не поддерживается браузером')}}).catch(()=>toast('Нет доступа к камере для фонарика'))}
/* ===== РЕАЛЬНЫЙ ИК ===== */
let CODES={};try{CODES=JSON.parse(localStorage.getItem('ircodes')||'{}')}catch(e){}
const saveC=()=>{try{localStorage.setItem('ircodes',JSON.stringify(CODES))}catch(e){}};
/* Банки кодов по брендам для телевизоров и аудиосистем. При нажатии кнопки код
   уходит сразу для всех брендов подряд — устройство само отзовётся на свой. */
const SM={'⏻':'02','🔇':'0F','Вход':'01',1:'04',2:'05',3:'06',4:'08',5:'09',6:'0A',7:'0C',8:'0D',9:'0E',0:'11','Гр −':'0B','Гр +':'07','Меню':'1A','Кан −':'10','Кан +':'12','▲':'60','▼':'61','◀':'65','▶':'62','OK':'68','Назад':'58','Домой':'79','Инфо':'1F'};
const LGM={'⏻':'08','🔇':'09','Вход':'0B',1:'11',2:'12',3:'13',4:'14',5:'15',6:'16',7:'17',8:'18',9:'19',0:'10','Гр −':'03','Гр +':'02','Меню':'43','Кан −':'01','Кан +':'00','▲':'40','▼':'41','◀':'07','▶':'06','OK':'44','Назад':'28'};
const SOM={'⏻':'15','🔇':'14','Вход':'25',1:'00',2:'01',3:'02',4:'03',5:'04',6:'05',7:'06',8:'07',9:'08',0:'09','Гр −':'13','Гр +':'12','Кан −':'11','Кан +':'10'};
const TOM={'⏻':'12','🔇':'10','Вход':'0F',1:'01',2:'02',3:'03',4:'04',5:'05',6:'06',7:'07',8:'08',9:'09',0:'00','Гр −':'1E','Гр +':'1A','Кан −':'1F','Кан +':'1B'};
const PHM={'⏻':'0C','🔇':'10',1:'01',2:'02',3:'03',4:'04',5:'05',6:'06',7:'07',8:'08',9:'09',0:'00','Гр −':'12','Гр +':'11','Кан −':'21','Кан +':'20'};
const PAM={'⏻':'3D','🔇':'20',1:'01',2:'02',3:'03',4:'04',5:'05',6:'06',7:'07',8:'08',9:'09',0:'00','Гр −':'0D','Гр +':'0C','Кан −':'0F','Кан +':'0E'};
const SHM={'⏻':'0F','🔇':'18',1:'01',2:'02',3:'03',4:'04',5:'05',6:'06',7:'07',8:'08',9:'09',0:'00','Гр −':'1A','Гр +':'19'};
const TVBR={Samsung:['SAMSUNG:07:',SM],LG:['NEC:04:',LGM],Sony:['SONY:01:',SOM],Toshiba:['NEC:40:',TOM],Philips:['NEC:00:',PHM],Panasonic:['NEC:40:',PAM],Sharp:['NEC:5A:',SHM]};
const LM={'⏻':'02','☀−':'BA','☀+':'3A','#ff2d2d':'1A','#35e04a':'9A','#2d7bff':'A2','#ffffff':'22'};
const DEF={};for(const k in LM)DEF['LED-лента|'+k]='NEC:00:'+LM[k];
const SPM={'⏻':'15','Bluetooth':'0D','⏮':'33','⏯':'32','⏭':'34','Гр −':'0E','Гр +':'0F'};
const SPBR={Samsung:['SAMSUNG:07:',SPM],Sony:['SONY:01:',SPM],JBL:['NEC:5A:',SPM],Xiaomi:['NEC:00:',SPM]};
/* Карта «устройство → банк брендов» делает кнопки универсальными без выбора марки. */
const UNIV={'Телевизор':TVBR,'Колонка / Аудио':SPBR};
const hx=v=>parseInt(v,16);
const bits=(v,n)=>Array.from({length:n},(_,i)=>(v>>i)&1);
function enc(str){const p=str.trim().split(':'),t=p[0].toUpperCase();
 if(t==='RAW')return{f:+p[1]||38000,d:p.slice(2).join(':').split(/[ ,]+/).map(Number).filter(Boolean)};
 const a=hx(p[1]),c=hx(p[2]);if(isNaN(a)||isNaN(c))throw 0;
 if(t==='NEC'||t==='SAMSUNG'){const sam=t==='SAMSUNG',d=sam?[4500,4500]:[9000,4500];
  [...bits(a,8),...bits(sam?a:~a&255,8),...bits(c,8),...bits(~c&255,8)].forEach(x=>d.push(560,x?1690:560));d.push(560);return{f:38000,d}}
 if(t==='SONY'){let d=[2400,600];[...bits(c,7),...bits(a,5)].forEach(x=>d.push(x?1200:600,600));d.pop();
  const gap=Math.max(1000,45000-d.reduce((x,y)=>x+y,0));return{f:40000,d:[...d,gap,...d,gap,...d]}}
 throw 0}
function toast(m){const t=$('toast');t.textContent=m;t.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.opacity=0,1800)}
function setStat(){$('stat').textContent=window.irTransmitter?'🟢 ИК-передатчик подключён':'🟡 Режим симуляции (ИК-передатчика нет)'}
document.addEventListener('deviceready',setStat,false);
function send(code){let e;try{e=enc(code)}catch(x){return toast('Неверный формат кода')}
 const T=window.irTransmitter;if(!T)return toast('Симуляция: '+code);
 try{T.transmit(e.f,e.d.join(','),()=>toast('📡 Отправлено'),er=>toast('Ошибка ИК: '+er))}catch(x){toast('Ошибка ИК: '+x)}}
const KEY=it=>cur.n+'|'+(it[0]||it[3]);
function press(it){blink();it[1](cur.s);draw();if(it[2]==='util')return;const k=KEY(it),L=k in CODES?[CODES[k]]:allCodes(k);if(L.length&&L[0])sendAll(L);else toast('Код не задан. Зажми кнопку на 1 сек.')}
function edit(it){const k=KEY(it),v=prompt('Код для «'+k.replace('|',' → ')+'»\n\nФормат (hex):\nNEC:адрес:команда\nSAMSUNG:07:02\nSONY:01:15\nRAW:38000:9000,4500,560,...\n\nПусто — удалить код',(k in CODES?CODES[k]:dflt(k))||'NEC:00:');if(v===null)return;CODES[k]=v.trim();saveC();toast(v.trim()?'Код сохранён':'Код удалён')}
function allCodes(k){const sep=k.indexOf('|'),dev=k.slice(0,sep),l=k.slice(sep+1);
 if(UNIV[dev]){const B=UNIV[dev],o=[];for(const b in B){const v=B[b][1][l];if(v!==undefined)o.push(B[b][0]+v)}return o}
 const d=DEF[k];return d?[d]:[]}
function sendAll(L){L.forEach((c,i)=>setTimeout(()=>send(c),i*180))}
/* Перебор большого набора кодов «Питание» известных брендов — для устройств без готовой
   карты (кондиционер, вентилятор и т.д.). Смотри на прибор и жми «Стоп», когда сработает. */
const BRUTE={SAMSUNG:'SAMSUNG:07:02',LG:'NEC:04:08',SONY:'SONY:01:15',TOSHIBA:'NEC:40:12',PHILIPS:'NEC:00:0C',PANASONIC:'NEC:40:3D',SHARP:'NEC:5A:0F',XIAOMI:'NEC:00:1C',HISENSE:'NEC:3D:1A',TCL:'NEC:02:0C',HAIER:'NEC:FC:3D',VESTEL:'NEC:07:02',JVC:'NEC:03:11',AIWA:'NEC:B8:F3',GREE:'NEC:3D:1F',MIDEA:'NEC:4D:19',DAIKIN:'NEC:D5:12',LGAC:'NEC:06:08'};
let bruteT=null;
function bruteStart(){if(bruteT)return bruteStop();const names=Object.keys(BRUTE);let i=0;
 toast('📡 Перебор '+names.length+' кодов. Смотри на прибор, жми «Автопоиск» ещё раз, когда сработает');
 bruteT=setInterval(()=>{if(i>=names.length){bruteStop();toast('Перебор закончен');return}send(BRUTE[names[i]]);i++},450)}
function bruteStop(){clearInterval(bruteT);bruteT=null}
/* ===== КАМЕРЫ ===== */
const CAMP=[['mjpeg','/video.mjpg'],['mjpeg','/videostream.cgi'],['mjpeg','/mjpeg'],['mjpeg','/video.cgi'],['mjpeg','/axis-cgi/mjpg/video.cgi'],['mjpeg','/cgi-bin/mjpg/video.cgi'],['snap','/snapshot.jpg'],['snap','/snap.jpg'],['snap','/image.jpg'],['snap','/cgi-bin/snapshot.cgi'],['snap','/jpg/image.jpg'],['snap','/capture']];
const PORTS=[80,8080,81,88];
let CAMS=[],snapT;try{CAMS=JSON.parse(localStorage.getItem('cams')||'[]')}catch(e){}
const saveCams=()=>{try{localStorage.setItem('cams',JSON.stringify(CAMS))}catch(e){}};
function openCams(){$('home').style.display='none';$('cams').style.display='block';drawCams()}
function probe(h,p,ms){return new Promise(r=>{const c=new AbortController(),t=setTimeout(()=>{c.abort();r(false)},ms);fetch(`http://${h}:${p}/`,{mode:'no-cors',signal:c.signal,cache:'no-store'}).then(()=>{clearTimeout(t);r(true)}).catch(()=>{clearTimeout(t);r(false)})})}
function imgOk(u,ms){return new Promise(r=>{const i=new Image(),t=setTimeout(()=>{i.src='';r(false)},ms);i.onload=()=>{clearTimeout(t);i.src='';r(true)};i.onerror=()=>{clearTimeout(t);r(false)};i.src=u})}
async function scan(){const sub=$('sub').value.trim().replace(/\.$/,''),q=[];for(let i=1;i<255;i++)q.push(sub+'.'+i);let done=0;const found=[];$('cst').textContent='Сканирую 0/254…';
 await Promise.all(Array.from({length:40},async()=>{while(q.length){const h=q.shift();for(const p of PORTS){if(await probe(h,p,1200)){found.push([h,p]);break}}done++;if(done%10==0)$('cst').textContent=`Сканирую ${done}/254, найдено: ${found.length}`}}));
 $('cst').textContent=`Найдено веб-устройств: ${found.length}. Проверяю камеры…`;
 for(const [h,p] of found){const base=`http://${h}:${p}`;let hit=null;for(const [t,pa] of CAMP){if(await imgOk(base+pa,2500)){hit=[t,pa];break}}
  if(hit){if(!CAMS.some(c=>c.url===base+hit[1]))CAMS.push({n:'Камера '+h,url:base+hit[1],t:hit[0]})}else if(!CAMS.some(c=>c.url===base+'/'))CAMS.push({n:'Устройство '+h,url:base+'/',t:'web'})}
 saveCams();drawCams();$('cst').textContent='Готово. Выбери камеру ниже.'}
function drawCams(){const L=$('clist');L.innerHTML='';if(!CAMS.length){L.innerHTML='<div class="note">Пока пусто</div>';return}
 CAMS.forEach((c,i)=>{const r=document.createElement('div');r.className='row';r.style.gridTemplateColumns='1fr auto';const b=document.createElement('button');b.className='b';b.textContent='▶ '+c.n+(c.t==='web'?' (веб-страница)':'');b.onclick=()=>play(c);const d=document.createElement('button');d.className='b';d.textContent='✕';d.onclick=()=>{CAMS.splice(i,1);saveCams();drawCams()};r.append(b,d);L.appendChild(r)})}
function stopView(){clearInterval(snapT);$('vimg').src='';const V=$('vvid');V.pause();V.removeAttribute('src');$('view').style.display='none'}
function play(c){stopView();const I=$('vimg'),V=$('vvid');if(c.t==='web'){window.open(c.url,'_system');return toast('Открываю веб-страницу устройства')}
 $('view').style.display='block';I.style.display=V.style.display='none';
 if(c.t==='mjpeg'){I.style.display='block';I.src=c.url}
 else if(c.t==='snap'){I.style.display='block';const f=()=>{I.src=c.url+(c.url.includes('?')?'&':'?')+'t='+Date.now()};f();snapT=setInterval(f,1000)}
 else{V.style.display='block';V.src=c.url;V.muted=false;V.play().catch(()=>{})}}
$('scan').onclick=scan;$('cback').onclick=()=>{stopView();$('cams').style.display='none';$('home').style.display='block'};$('vstop').onclick=stopView;
$('vsnd').onclick=()=>{const V=$('vvid');if(V.style.display==='none')return toast('В MJPEG и снимках звука нет — нужен HLS-поток');V.muted=!V.muted;toast(V.muted?'Звук выкл':'Звук вкл')};
$('cadd').onclick=()=>{const u=$('curl').value.trim();if(!/^https?:\/\//.test(u))return toast('Нужен адрес вида http://…');CAMS.push({n:'Камера '+u.replace(/^https?:\/\//,'').slice(0,24),url:u,t:$('ctype').value});saveCams();drawCams();$('curl').value=''};
let cur=null,irT;
function blink(){['ir1','ir2'].forEach(i=>$(i).classList.add('on'));clearTimeout(irT);irT=setTimeout(()=>['ir1','ir2'].forEach(i=>$(i).classList.remove('on')),120);try{navigator.vibrate&&navigator.vibrate(15)}catch(e){}}
function home(){$('grid').innerHTML='';D.forEach((d,k)=>{const b=document.createElement('button');b.className='dev'+(d.s.on?' lit':'');b.innerHTML=`<span>${d.i}</span>${d.n}`;b.onclick=()=>open(k);$('grid').appendChild(b)});const cc=document.createElement('button');cc.className='dev';cc.innerHTML='<span>📹</span>Камеры (поиск)';cc.onclick=openCams;$('grid').appendChild(cc)}
function open(k){cur=D[k];$('home').style.display='none';$('remote').style.display='block';$('title').textContent=cur.i+' '+cur.n;build();draw()}
function draw(){const g=cur.glow?`<div class="glow" style="background:${cur.glow(cur.s)};box-shadow:0 0 30px 10px ${cur.glow(cur.s)}"></div>`:'';$('scr').innerHTML=g+cur.info(cur.s).replace(/\n/g,'<br>');$('rows').classList.toggle('off',!cur.s.on)}
function build(){const R=$('rows');R.innerHTML='';cur.rows.forEach(row=>{const r=document.createElement('div');r.className='row';r.style.gridTemplateColumns=`repeat(${row.length},1fr)`;row.forEach(it=>{if(!it){r.appendChild(document.createElement('div'));return}
const b=document.createElement('button');b.className='b '+(it[2]||'');b.textContent=it[0];if(it[3])b.style.background=it[3];
let tm,lp=0;b.onpointerdown=()=>{if(it[2]==='util')return;lp=0;clearTimeout(tm);tm=setTimeout(()=>{lp=1;edit(it)},900)};b.onpointerup=b.onpointerleave=b.onpointercancel=()=>clearTimeout(tm);b.oncontextmenu=e=>e.preventDefault();b.onclick=()=>{if(!lp)press(it)};r.appendChild(b)});R.appendChild(r)})}
$('back').onclick=()=>{$('remote').style.display='none';$('home').style.display='block';home()};
home();setStat();
</script></body></html>
