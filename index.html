<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Универсальный пульт</title>
<style>
:root{--bg:#eef0f4;--card:#fff;--tx:#161a22;--mut:#6b7280;--btn:#e6e9f0;--acc:#4f6bff;--pw:#ef4444;--scr:#0f172a;--scrtx:#7CFFB2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1017;--card:#171b26;--tx:#eef1f8;--mut:#98a2b3;--btn:#252b3a;--scrtx:#7CFFB2;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{max-width:460px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:6px 0 12px;display:flex;justify-content:space-between;align-items:center}
.ir{width:12px;height:12px;border-radius:50%;background:#555;transition:.1s}
.ir.on{background:#ff3b3b;box-shadow:0 0 12px 4px #ff3b3b}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.dev{background:var(--card);border:2px solid transparent;border-radius:16px;padding:14px 4px;text-align:center;cursor:pointer;color:var(--tx);font:inherit;font-size:13px}
.dev span{display:block;font-size:30px;margin-bottom:4px}
.dev.lit{border-color:var(--acc)}
#remote{display:none}
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.back{background:var(--btn);color:var(--tx);border:0;border-radius:12px;padding:10px 14px;font-size:15px;cursor:pointer}
.body{background:var(--card);border-radius:28px;padding:16px;box-shadow:0 8px 30px rgba(0,0,0,.18)}
.scr{background:var(--scr);color:var(--scrtx);border-radius:14px;padding:12px;min-height:84px;font-family:ui-monospace,Menlo,monospace;font-size:14px;line-height:1.5;margin-bottom:14px;position:relative;overflow:hidden}
.scr .glow{position:absolute;right:12px;top:12px;width:56px;height:56px;border-radius:50%}
.rows{display:flex;flex-direction:column;gap:9px}
.row{display:grid;gap:9px}
.b{background:var(--btn);color:var(--tx);border:0;border-radius:14px;padding:13px 4px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;min-height:46px}
.b:active{transform:scale(.94);background:var(--acc);color:#fff}
.b.pw{background:var(--pw);color:#fff}
.b.ok{background:var(--acc);color:#fff;border-radius:50%}
.sw{min-height:40px;border:2px solid rgba(255,255,255,.4)}
.off .b:not(.pw){opacity:.4}
.b{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#000c;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;transition:.2s;pointer-events:none;max-width:90%;text-align:center;z-index:9}
#stat{font-size:13px;text-align:center;margin:0 0 12px;color:var(--mut)}
.note{font-size:12px;color:var(--mut);text-align:center;margin-top:14px;line-height:1.4}
</style></head><body>
<div class="app">
<div id="home"><h1>📡 Универсальный пульт <i class="ir" id="ir1"></i></h1>
<div class="grid" id="grid"></div>
<p id="stat"></p><p class="note">Выбери устройство — откроется его пульт.<br>Зажми любую кнопку на 1 секунду, чтобы задать или изменить её ИК-код.</p></div>
<div id="remote"><div class="top"><button class="back" id="back">← Назад</button><b id="title" style="flex:1"></b><i class="ir" id="ir2"></i></div>
<div class="body"><button class="b" id="brand" style="width:100%;margin-bottom:12px;display:none"></button><div class="scr" id="scr"></div><div class="rows" id="rows"></div></div></div>
</div>
<div id="toast"></div>
<script src="cordova.js"></script>
<script>
const $=id=>document.getElementById(id);
const cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const cyc=(arr,v)=>arr[(arr.indexOf(v)+1)%arr.length];
const PW=['⏻',s=>{s.on=!s.on},'pw'];
const dpad=(u,d,l,r,ok)=>[[null,['▲',u],null],[['◀',l],['OK',ok,'ok'],['▶',r]],[null,['▼',d],null]];
const nums=f=>[[1,2,3],[4,5,6],[7,8,9],['',0,'']].map(r=>r.map(n=>n===''?null:[String(n),s=>f(s,n)]));
const COLORS=['#ff2d2d','#ff8a00','#ffe600','#35e04a','#00e5d0','#2d7bff','#8a3dff','#ff3dd0','#ffffff','#ffb347','#7fffd4','#c0a0ff'];
const D=[
{n:'Кондиционер',i:'❄️',s:{on:0,t:24,m:'Авто',f:'Авто',sw:0},
 info:s=>s.on?`${s.t}°C\nРежим: ${s.m}\nВентилятор: ${s.f}\nЖалюзи: ${s.sw?'качаются':'зафикс.'}`:'ВЫКЛ',
 rows:[[PW,['Режим',s=>s.m=cyc(['Авто','Холод','Тепло','Сушка','Вент.'],s.m)]],[['−',s=>s.t=cl(s.t-1,16,30)],['+',s=>s.t=cl(s.t+1,16,30)]],[['Скорость',s=>s.f=cyc(['Авто','Низк.','Средн.','Высок.'],s.f)],['Жалюзи',s=>s.sw=!s.sw]],[['Эко',s=>{s.t=26;s.m='Холод'}],['Сон',s=>{s.t=cl(s.t+1,16,30)}],['Турбо',s=>{s.f='Высок.';s.t=16}]]]},
{n:'Телевизор',i:'📺',s:{on:0,v:20,ch:1,mu:0,src:'HDMI 1'},
 info:s=>s.on?`Канал ${s.ch}\nГромкость: ${s.mu?'🔇':s.v}\nВход: ${s.src}`:'ВЫКЛ',
 rows:[[PW,['🔇',s=>s.mu=!s.mu],['Вход',s=>s.src=cyc(['HDMI 1','HDMI 2','AV','USB','ТВ'],s.src)]],...nums((s,n)=>{s.ch=n}),[['Гр −',s=>{s.v=cl(s.v-5,0,100);s.mu=0}],['Меню',s=>{}],['Гр +',s=>{s.v=cl(s.v+5,0,100);s.mu=0}]],[['Кан −',s=>s.ch=Math.max(1,s.ch-1)],['Кан +',s=>s.ch++]],...dpad(s=>{},s=>{},s=>{},s=>{},s=>{}),[['Назад',s=>{}],['Домой',s=>{}],['Инфо',s=>{}]]]},
{n:'Проектор / баннер',i:'📽️',s:{on:0,src:'HDMI',foc:50,key:0,blank:0,frz:0},
 info:s=>s.on?`Вход: ${s.src}\nФокус: ${s.foc}\nТрапеция: ${s.key}\n${s.blank?'Экран скрыт':s.frz?'Кадр заморожен':'Показ'}`:'ВЫКЛ',
 rows:[[PW,['Вход',s=>s.src=cyc(['HDMI','VGA','USB','Wi‑Fi'],s.src)]],[['Фокус −',s=>s.foc=cl(s.foc-5,0,100)],['Фокус +',s=>s.foc=cl(s.foc+5,0,100)]],[['Трап. −',s=>s.key=cl(s.key-1,-20,20)],['Трап. +',s=>s.key=cl(s.key+1,-20,20)]],[['Скрыть',s=>s.blank=!s.blank],['Стоп-кадр',s=>s.frz=!s.frz]],...dpad(s=>{},s=>{},s=>{},s=>{},s=>{}),[['Меню',s=>{}],['Назад',s=>{}]]]},
{n:'Компьютер',i:'🖥️',s:{on:0,v:40,mu:0,pl:0,sl:0,lk:0},
 info:s=>s.on?`${s.sl?'Спящий режим':s.lk?'Экран заблокирован':'Работает'}\nГромкость: ${s.mu?'🔇':s.v}\n${s.pl?'▶ Играет':'⏸ Пауза'}`:'ВЫКЛ',
 rows:[[PW,['Сон',s=>s.sl=!s.sl],['Перезагр.',s=>{s.sl=0;s.lk=0;s.pl=0}]],[['Блок',s=>s.lk=!s.lk],['Alt+Tab',s=>{}],['Раб. стол',s=>{}]],[['⏮',s=>{}],['⏯',s=>s.pl=!s.pl],['⏭',s=>{}]],[['🔉',s=>{s.v=cl(s.v-5,0,100);s.mu=0}],['🔇',s=>s.mu=!s.mu],['🔊',s=>{s.v=cl(s.v+5,0,100);s.mu=0}]],...dpad(s=>{},s=>{},s=>{},s=>{},s=>{}),[['Esc',s=>{}],['Enter',s=>{}]]]},
{n:'Лампа',i:'💡',s:{on:0,br:70,tp:50,tm:0},
 glow:s=>s.on?`rgba(255,${Math.round(150+s.tp*1.0)},${Math.round(60+s.tp*1.9)},${s.br/100})`:'transparent',
 info:s=>s.on?`Яркость: ${s.br}%\nТемпература: ${s.tp<35?'тёплая':s.tp>65?'холодная':'нейтральная'}\nТаймер: ${s.tm?s.tm+' мин':'нет'}`:'ВЫКЛ',
 rows:[[PW,['Таймер',s=>s.tm=cyc([0,15,30,60],s.tm)]],[['☀− ',s=>s.br=cl(s.br-10,5,100)],['☀+',s=>s.br=cl(s.br+10,5,100)]],[['🔥 Теплее',s=>s.tp=cl(s.tp-15,0,100)],['❄ Холоднее',s=>s.tp=cl(s.tp+15,0,100)]],[['Ночник',s=>{s.br=5;s.tp=10}],['Чтение',s=>{s.br=80;s.tp=60}],['Макс',s=>{s.br=100;s.tp=50}]]]},
{n:'LED-лента',i:'🌈',s:{on:0,c:'#2d7bff',br:80,md:'Статика',sp:3},
 glow:s=>s.on?s.c:'transparent',
 info:s=>s.on?`Режим: ${s.md}\nЯркость: ${s.br}%\nСкорость: ${s.sp}`:'ВЫКЛ',
 rows:[[PW,['Режим',s=>s.md=cyc(['Статика','Плавно','Вспышка','Радуга','Пульс'],s.md)]],[['☀−',s=>s.br=cl(s.br-10,5,100)],['☀+',s=>s.br=cl(s.br+10,5,100)],['Скор −',s=>s.sp=cl(s.sp-1,1,5)],['Скор +',s=>s.sp=cl(s.sp+1,1,5)]],...[0,4,8].map(k=>COLORS.slice(k,k+4).map(c=>['',s=>{s.c=c;s.md='Статика'},'sw',c]))]},
{n:'Камера',i:'📷',s:{on:0,rec:0,z:1,px:0,py:0,nt:0,mic:1,ph:0},
 info:s=>s.on?`${s.rec?'🔴 ЗАПИСЬ':'Ожидание'}\nZoom: x${s.z.toFixed(1)}  Поворот: ${s.px}°/${s.py}°\nНочь: ${s.nt?'да':'нет'}  Микрофон: ${s.mic?'вкл':'выкл'}\nСнимков: ${s.ph}`:'ВЫКЛ',
 rows:[[PW,['⏺ REC',s=>s.rec=!s.rec],['📸',s=>s.ph++]],[['Zoom −',s=>s.z=cl(s.z-.5,1,8)],['Zoom +',s=>s.z=cl(s.z+.5,1,8)]],...dpad(s=>s.py=cl(s.py+10,-90,90),s=>s.py=cl(s.py-10,-90,90),s=>s.px=cl(s.px-10,-180,180),s=>s.px=cl(s.px+10,-180,180),s=>{s.px=0;s.py=0}),[['🌙 Ночь',s=>s.nt=!s.nt],['🎤',s=>s.mic=!s.mic]]]},
{n:'Вентилятор',i:'🌀',s:{on:0,sp:1,osc:0,tm:0,md:'Норма'},
 info:s=>s.on?`Скорость: ${s.sp}/3\nПоворот: ${s.osc?'вкл':'выкл'}\nРежим: ${s.md}\nТаймер: ${s.tm?s.tm+' ч':'нет'}`:'ВЫКЛ',
 rows:[[PW,['Поворот',s=>s.osc=!s.osc]],[['Ск −',s=>s.sp=cl(s.sp-1,1,3)],['Ск +',s=>s.sp=cl(s.sp+1,1,3)]],[['Режим',s=>s.md=cyc(['Норма','Природа','Сон'],s.md)],['Таймер',s=>s.tm=cyc([0,1,2,4],s.tm)]]]},
{n:'Колонка / Аудио',i:'🔊',s:{on:0,v:30,pl:0,tr:1,bs:0,bt:0},
 info:s=>s.on?`${s.pl?'▶':'⏸'} Трек ${s.tr}\nГромкость: ${s.v}\nБас: ${s.bs>0?'+':''}${s.bs}\nBluetooth: ${s.bt?'подключён':'ожидание'}`:'ВЫКЛ',
 rows:[[PW,['Bluetooth',s=>s.bt=!s.bt]],[['⏮',s=>s.tr=Math.max(1,s.tr-1)],['⏯',s=>s.pl=!s.pl],['⏭',s=>s.tr++]],[['Гр −',s=>s.v=cl(s.v-5,0,100)],['Гр +',s=>s.v=cl(s.v+5,0,100)]],[['Бас −',s=>s.bs=cl(s.bs-1,-5,5)],['Бас +',s=>s.bs=cl(s.bs+1,-5,5)]]]}
];
/* ===== РЕАЛЬНЫЙ ИК ===== */
let CODES={};try{CODES=JSON.parse(localStorage.getItem('ircodes')||'{}')}catch(e){}
const saveC=()=>{try{localStorage.setItem('ircodes',JSON.stringify(CODES))}catch(e){}};
const SM={'⏻':'02','🔇':'0F','Вход':'01',1:'04',2:'05',3:'06',4:'08',5:'09',6:'0A',7:'0C',8:'0D',9:'0E',0:'11','Гр −':'0B','Гр +':'07','Меню':'1A','Кан −':'10','Кан +':'12','▲':'60','▼':'61','◀':'65','▶':'62','OK':'68','Назад':'58','Домой':'79','Инфо':'1F'};
const LM={'⏻':'02','☀−':'BA','☀+':'3A','#ff2d2d':'1A','#35e04a':'9A','#2d7bff':'A2','#ffffff':'22'};
const DEF={};const LGM={'⏻':'08','🔇':'09','Вход':'0B',1:'11',2:'12',3:'13',4:'14',5:'15',6:'16',7:'17',8:'18',9:'19',0:'10','Гр −':'03','Гр +':'02','Меню':'43','Кан −':'01','Кан +':'00','▲':'40','▼':'41','◀':'07','▶':'06','OK':'44','Назад':'28'};
const SOM={'⏻':'15','🔇':'14','Вход':'25',1:'00',2:'01',3:'02',4:'03',5:'04',6:'05',7:'06',8:'07',9:'08',0:'09','Гр −':'13','Гр +':'12','Кан −':'11','Кан +':'10'};
const TOM={'⏻':'12','🔇':'10','Вход':'0F',1:'01',2:'02',3:'03',4:'04',5:'05',6:'06',7:'07',8:'08',9:'09',0:'00','Гр −':'1E','Гр +':'1A','Кан −':'1F','Кан +':'1B'};
const BR={Samsung:['SAMSUNG:07:',SM],LG:['NEC:04:',LGM],Sony:['SONY:01:',SOM],Toshiba:['NEC:40:',TOM]};
let brand='Samsung';try{brand=localStorage.getItem('brand')||'Samsung'}catch(e){}
function dflt(k){if(k.startsWith('Телевизор|')){const b=BR[brand],v=b[1][k.slice(10)];return v!==undefined?b[0]+v:undefined}return DEF[k]}
function updBrand(){$('brand').textContent='🏷 Бренд ТВ: '+brand+' — нажми для подбора'}
$('brand').onclick=()=>{const n=Object.keys(BR),i=(n.indexOf(brand)+1)%n.length;brand=n[i];try{localStorage.setItem('brand',brand)}catch(e){}updBrand();blink();send(dflt('Телевизор|⏻'));toast('Отправлен «Питание» для '+brand)};for(const k in LM)DEF['LED-лента|'+k]='NEC:00:'+LM[k];
const hx=v=>parseInt(v,16);
const bits=(v,n)=>Array.from({length:n},(_,i)=>(v>>i)&1);
function enc(str){const p=str.trim().split(':'),t=p[0].toUpperCase();
 if(t==='RAW')return{f:+p[1]||38000,d:p.slice(2).join(':').split(/[ ,]+/).map(Number).filter(Boolean)};
 const a=hx(p[1]),c=hx(p[2]);if(isNaN(a)||isNaN(c))throw 0;
 if(t==='NEC'||t==='SAMSUNG'){const sam=t==='SAMSUNG',d=sam?[4500,4500]:[9000,4500];
  [...bits(a,8),...bits(sam?a:~a&255,8),...bits(c,8),...bits(~c&255,8)].forEach(x=>d.push(560,x?1690:560));d.push(560);return{f:38000,d}}
 if(t==='SONY'){let d=[2400,600];[...bits(c,7),...bits(a,5)].forEach(x=>d.push(x?1200:600,600));d.pop();
  const gap=Math.max(1000,45000-d.reduce((x,y)=>x+y,0));return{f:40000,d:[...d,gap,...d,gap,...d]}}
 throw 0}
function toast(m){const t=$('toast');t.textContent=m;t.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.opacity=0,1800)}
function setStat(){$('stat').textContent=window.irTransmitter?'🟢 ИК-передатчик подключён':'🟡 Режим симуляции (ИК-передатчика нет)'}
document.addEventListener('deviceready',setStat,false);
function send(code){let e;try{e=enc(code)}catch(x){return toast('Неверный формат кода')}
 const T=window.irTransmitter;if(!T)return toast('Симуляция: '+code);
 try{T.transmit(e.f,e.d.join(','),()=>toast('📡 Отправлено'),er=>toast('Ошибка ИК: '+er))}catch(x){toast('Ошибка ИК: '+x)}}
const KEY=it=>cur.n+'|'+(it[0]||it[3]);
function press(it){blink();it[1](cur.s);draw();const k=KEY(it),c=k in CODES?CODES[k]:dflt(k);if(c)send(c);else toast('Код не задан. Зажми кнопку на 1 сек.')}
function edit(it){const k=KEY(it),v=prompt('Код для «'+k.replace('|',' → ')+'»\n\nФормат (hex):\nNEC:адрес:команда\nSAMSUNG:07:02\nSONY:01:15\nRAW:38000:9000,4500,560,...\n\nПусто — удалить код',(k in CODES?CODES[k]:dflt(k))||'NEC:00:');if(v===null)return;CODES[k]=v.trim();saveC();toast(v.trim()?'Код сохранён':'Код удалён')}
let cur=null,irT;
function blink(){['ir1','ir2'].forEach(i=>$(i).classList.add('on'));clearTimeout(irT);irT=setTimeout(()=>['ir1','ir2'].forEach(i=>$(i).classList.remove('on')),120);try{navigator.vibrate&&navigator.vibrate(15)}catch(e){}}
function home(){$('grid').innerHTML='';D.forEach((d,k)=>{const b=document.createElement('button');b.className='dev'+(d.s.on?' lit':'');b.innerHTML=`<span>${d.i}</span>${d.n}`;b.onclick=()=>open(k);$('grid').appendChild(b)})}
function open(k){cur=D[k];$('brand').style.display=cur.n==='Телевизор'?'block':'none';updBrand();$('home').style.display='none';$('remote').style.display='block';$('title').textContent=cur.i+' '+cur.n;build();draw()}
function draw(){const g=cur.glow?`<div class="glow" style="background:${cur.glow(cur.s)};box-shadow:0 0 30px 10px ${cur.glow(cur.s)}"></div>`:'';$('scr').innerHTML=g+cur.info(cur.s).replace(/\n/g,'<br>');$('rows').classList.toggle('off',!cur.s.on)}
function build(){const R=$('rows');R.innerHTML='';cur.rows.forEach(row=>{const r=document.createElement('div');r.className='row';r.style.gridTemplateColumns=`repeat(${row.length},1fr)`;row.forEach(it=>{if(!it){r.appendChild(document.createElement('div'));return}
const b=document.createElement('button');b.className='b '+(it[2]||'');b.textContent=it[0];if(it[3])b.style.background=it[3];
let tm,lp=0;b.onpointerdown=()=>{lp=0;clearTimeout(tm);tm=setTimeout(()=>{lp=1;edit(it)},900)};b.onpointerup=b.onpointerleave=b.onpointercancel=()=>clearTimeout(tm);b.oncontextmenu=e=>e.preventDefault();b.onclick=()=>{if(!lp)press(it)};r.appendChild(b)});R.appendChild(r)})}
$('back').onclick=()=>{$('remote').style.display='none';$('home').style.display='block';home()};
home();setStat();
</script></body></html>
